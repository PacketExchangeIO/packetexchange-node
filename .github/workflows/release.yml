name: Release

# Publishes to npm when a GitHub release is published. Authentication is npm Trusted
# Publishing (OpenID Connect): npm trusts this workflow in this repository, so no token is
# stored anywhere, and the package carries a provenance attestation linking it to this build.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # The release tag must match package.json, so a release can never publish a
      # different version from the one it names.
      - name: Check the tag matches the package version
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Typecheck, build and test
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Publish
        run: npm publish --access public --provenance --ignore-scripts
